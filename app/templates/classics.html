{% extends "base.html" %}
{% block title %}国学卡 · 认知内核训练终端{% endblock %}
{% block content %}
<style>
/* 顶部信息条 */
.stat-bar{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:baseline;margin:.2rem 0 1.2rem}
.stat-bar .big{font-family:var(--mono);font-size:1.6rem;color:var(--accent);font-weight:800}
.stat-bar .lbl{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* 分类 tab */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.tab{
  font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;
  padding:.34rem .75rem;border:1px solid var(--line);border-radius:2px;
  background:var(--bg-2);color:var(--muted);cursor:pointer;transition:.16s;
  display:inline-flex;gap:.4rem;align-items:center;
}
.tab:hover{color:var(--text);border-color:var(--line-2)}
.tab.active{color:var(--accent);border-color:rgba(52,211,230,.45);background:rgba(52,211,230,.08)}
.tab .cnt{font-size:.68rem;color:var(--muted)}
.tab.fav.active{color:var(--jade);border-color:rgba(139,127,224,.45);background:rgba(139,127,224,.08)}

/* 抽卡区 */
.draw-zone{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1.5rem}
.card3d{perspective:1400px}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card3d.flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  border:1px solid var(--line-2);border-radius:4px;
  background:linear-gradient(155deg,var(--bg-2),var(--bg-3));
  padding:1.5rem 1.6rem;backface-visibility:hidden;
}
.card-front{position:relative}
.card-back{
  position:absolute;inset:0;transform:rotateY(180deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;
  background:
    repeating-linear-gradient(45deg,rgba(52,211,230,.05) 0 8px,transparent 8px 16px),
    linear-gradient(155deg,var(--bg-2),var(--bg-3));
}
.card-back .emblem{font-family:var(--serif);font-size:2.4rem;color:var(--accent);letter-spacing:.3em}
.card-back .hint{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.18em}

.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.card-code{font-family:var(--mono);font-size:.82rem;color:var(--accent);letter-spacing:.08em}
.card-cat{font-family:var(--mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);padding:.1rem .5rem;border-radius:2px}
.card-ref{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.05em;margin-bottom:.6rem}
.card-text{font-family:var(--serif);font-size:1.32rem;line-height:1.95;color:var(--text);margin:0 0 1rem;padding-left:1rem;border-left:2px solid var(--accent);quotes:none}
.card-yiji{display:flex;gap:1.4rem;font-family:var(--mono);font-size:.82rem;letter-spacing:.05em;margin-bottom:1rem}
.card-yiji .yi{color:var(--jade)} .card-yiji .ji{color:var(--danger)}
.card-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.card-actions .btn{font-size:.74rem!important;padding:.42rem .9rem!important}
.btn.draw{background:var(--accent);color:#0e0f12;border:1px solid var(--accent)}
.btn.draw:hover{background:var(--accent-soft)}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.line:hover{border-color:var(--accent);color:var(--accent)}
.btn.fav-on{background:rgba(139,127,224,.14);color:var(--jade);border:1px solid rgba(139,127,224,.45)}

/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.tile{
  background:var(--bg-2);border:1px solid var(--line);border-radius:3px;
  padding:.85rem .9rem;cursor:pointer;transition:.16s;position:relative;
}
.tile:hover{border-color:var(--line-2);transform:translateY(-2px)}
.tile .t-code{font-family:var(--mono);font-size:.7rem;color:var(--accent);letter-spacing:.06em}
.tile .t-ref{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin:.15rem 0 .4rem}
.tile .t-text{font-family:var(--serif);font-size:.95rem;line-height:1.6;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .t-fav{position:absolute;top:.6rem;right:.7rem;color:var(--jade);font-size:.8rem;opacity:0}
.tile.faved .t-fav{opacity:1}

.empty{color:var(--muted);font-family:var(--mono);font-size:.85rem;padding:1rem 0}
.toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%) translateY(20px);
  background:var(--bg-3);border:1px solid var(--accent);color:var(--text);
  font-family:var(--mono);font-size:.8rem;padding:.6rem 1.1rem;border-radius:3px;
  opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:780px){.draw-zone{grid-template-columns:1.1fr .9fr;align-items:start}}
</style>

<div class="stat-bar">
  <div><span class="big" id="totalN">0</span> <span class="lbl">张原文卡</span></div>
  <div><span class="big" id="favN">0</span> <span class="lbl">已收藏</span></div>
  <div><span class="lbl">分类 / {{ categories|length }} 家</span></div>
</div>

<div class="tabs" id="tabs"></div>

<div class="draw-zone">
  <div class="card3d" id="card">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front" id="cardFront">
        <div class="card-top">
          <span class="card-code" id="cCode">··</span>
          <span class="card-cat" id="cCat">—</span>
        </div>
        <div class="card-ref" id="cRef">—</div>
        <p class="card-text" id="cText">—</p>
        <div class="card-yiji">
          <span class="yi">宜 <b id="cYi">—</b></span>
          <span class="ji">忌 <b id="cJi">—</b></span>
        </div>
        <div class="card-actions">
          <button class="btn line" id="btnCopy">复制原文</button>
          <button class="btn line" id="btnFav">★ 收藏</button>
        </div>
      </div>
      <div class="card-face card-back">
        <div class="emblem">国学</div>
        <div class="hint">抽 一 张</div>
      </div>
    </div>
  </div>
  <div>
    <button class="btn draw" id="btnDraw" style="width:100%;padding:.8rem!important;font-size:.95rem!important">⟳ 抽一张</button>
    <p class="muted" style="margin:.8rem 0 0">点「抽一张」随机抽一段原文,或选下方分类按流派抽取。卡片仅含典籍原文,不作解释——留白处,自己体会。</p>
  </div>
</div>

<div class="sec"><span class="no">库</span><h2>全部卡片</h2><span class="line"></span></div>
<div class="grid" id="grid"></div>

<div class="toast" id="toast"></div>

<script>
const ALL = {{ classics_json | safe }};
const CATS = {{ categories | tojson }};
const CATEGORY_JI = {
  "道家":"强为","儒家":"放纵","兵家":"轻动","易理":"执固",
  "诗词":"喧扰","法家":"徇私","养生":"耗神"
};
const FAV_KEY = "fav_classics_v1";
let favs = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
let activeTab = "all";
let current = null;

function saveFavs(){ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }
function scope(){
  if(activeTab === "fav") return ALL.filter(c => favs.indexOf(c.code) >= 0);
  if(activeTab === "all") return ALL;
  return ALL.filter(c => c.category === activeTab);
}
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1400);
}
function paint(c){
  current = c;
  document.getElementById('cCode').textContent = c.code;
  document.getElementById('cCat').textContent = c.category;
  document.getElementById('cRef').textContent = c.book + " · " + c.chapter;
  document.getElementById('cText').textContent = c.text;
  document.getElementById('cYi').textContent = c.yi || "守中";
  document.getElementById('cJi').textContent = CATEGORY_JI[c.category] || "妄动";
  var bf = document.getElementById('btnFav');
  if(favs.indexOf(c.code) >= 0){ bf.textContent="★ 已收藏"; bf.classList.add('fav-on'); }
  else { bf.textContent="☆ 收藏"; bf.classList.remove('fav-on'); }
}
function reveal(c){
  var card=document.getElementById('card');
  card.classList.add('flipped');
  setTimeout(function(){ paint(c); card.classList.remove('flipped'); }, 320);
}
function drawRandom(){
  var list = scope();
  if(!list.length){ toast(activeTab==="fav"?"收藏夹是空的":"该分类暂无卡片"); return; }
  var c = list[Math.floor(Math.random()*list.length)];
  reveal(c);
}
function todaySign(){
  var d=new Date(), key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  var h=0; for(var i=0;i<key.length;i++){h=(h*31+key.charCodeAt(i))>>>0;}
  return ALL[h % ALL.length];
}
function renderTabs(){
  var box=document.getElementById('tabs'); box.innerHTML="";
  var defs=[{k:"all",n:"全部",c:ALL.length},{k:"fav",n:"★ 收藏",c:favs.length,fav:true}];
  CATS.forEach(function(cat){ defs.push({k:cat,n:cat,c:ALL.filter(x=>x.category===cat).length}); });
  defs.forEach(function(d){
    var el=document.createElement('div');
    el.className="tab"+(d.fav?" fav":"")+(d.k===activeTab?" active":"");
    el.innerHTML=d.n+' <span class="cnt">'+d.c+'</span>';
    el.onclick=function(){ activeTab=d.k; renderTabs(); renderGrid(); };
    box.appendChild(el);
  });
}
function renderGrid(){
  var g=document.getElementById('grid'); g.innerHTML="";
  var list=scope();
  if(!list.length){ g.innerHTML='<div class="empty">这里还没有卡片。</div>'; return; }
  list.forEach(function(c){
    var t=document.createElement('div');
    t.className="tile"+(favs.indexOf(c.code)>=0?" faved":"");
    t.innerHTML='<div class="t-fav">★</div>'+
      '<div class="t-code">'+c.code+'</div>'+
      '<div class="t-ref">'+c.book+' · '+c.chapter+'</div>'+
      '<div class="t-text">'+c.text+'</div>';
    t.onclick=function(){ reveal(c); document.getElementById('card').scrollIntoView({behavior:'smooth',block:'center'}); };
    g.appendChild(t);
  });
}
document.getElementById('btnDraw').onclick=drawRandom;
document.getElementById('btnCopy').onclick=function(){
  if(!current) return;
  var txt="【"+current.book+"·"+current.chapter+"】\n"+current.text;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast("原文已复制");},function(){toast("复制失败");});
  } else { toast("当前环境不支持复制"); }
};
document.getElementById('btnFav').onclick=function(){
  if(!current) return;
  var i=favs.indexOf(current.code);
  if(i>=0){ favs.splice(i,1); toast("已取消收藏"); }
  else { favs.push(current.code); toast("已收藏 "+current.code); }
  saveFavs(); paint(current); renderTabs(); renderGrid();
  document.getElementById('favN').textContent=favs.length;
};
// init
document.getElementById('totalN').textContent=ALL.length;
document.getElementById('favN').textContent=favs.length;
renderTabs(); renderGrid();
paint(todaySign());   // 载入即显示今日签(不翻面)
</script>
{% endblock %}
